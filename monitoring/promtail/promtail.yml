server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: backend
          __path__: /var/log/jobhunt/backend/*.log*

  - job_name: backend-dot-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: backend
          __path__: /var/log/jobhunt/backend/backend.logs

  - job_name: frontend-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: frontend
          __path__: /var/log/jobhunt/frontend/*.log*

  - job_name: frontend-dot-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: frontend
          __path__: /var/log/jobhunt/frontend/frontend.logs
